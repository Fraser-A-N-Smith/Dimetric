# How this project runs.
#
# Everything here is part of the replay contract rather than a preference: two
# people running the same input log have to agree on these or they are not
# playing the same game. That is why they are committed with the project
# instead of living in a settings file on somebody's machine.

# What the window and the taskbar call this game, and what they show for it.
#
# The only section here that is *not* part of the replay contract: a title and
# an icon reach a window manager and nothing else, so renaming the game cannot
# change what a recorded run replays to. They live here because this is the
# file the project already has.
[game]
name = "Sorcerer"
# Outside `assets/`, because an icon is not game art: anything under `assets/`
# is imported and packed into the atlas, and a window decoration has no reason
# to be in there. A path under `assets/` works too; `dim build` stages whichever
# this names.
icon = "icon.png"

[sim]
# Ticks per second. Changing it changes what every recorded run means.
tick_rate = 60

[ui]
# The virtual resolution the UI is laid out against, scaled to whatever window
# the game gets. Not the window's own size: layout decides which control a
# click lands on, so a canvas that moved with the window would make a recorded
# click land on a different button on a different monitor.
canvas = [320, 180]

[render]
# The resolution the world is drawn at, before upscaling. In the contract
# rather than in a preferences file because a wider viewport shows *more world*
# at the same zoom, so `camera.to_world` — how a script turns a pointer into a
# world cell — depends on it. Two players whose resolutions differed would
# click different cells from the same pointer.
resolution = [480, 270]

# Keys to actions. Declaring this section replaces the defaults entirely, so
# every action the game uses has to appear. Key names come from the window
# library; one this build does not recognise simply never fires.
[input]
up = ["KeyW", "ArrowUp"]
down = ["KeyS", "ArrowDown"]
left = ["KeyA", "ArrowLeft"]
right = ["KeyD", "ArrowRight"]
fire = ["Space", "Mouse0"]
alt = ["Mouse1"]
dash = ["ShiftLeft"]
use = ["KeyE"]
pause = ["Escape"]
