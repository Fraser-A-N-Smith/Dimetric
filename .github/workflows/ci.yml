name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The gates that do not need three operating systems to be meaningful.
  checks:
    name: Lints and invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # I3, I4 and I5. None of these produces a compile error on its own, and
      # all of them surface weeks later as a replay that diverges on somebody
      # else's machine.
      - name: Simulation invariants
        run: cargo run -p xtask -- lint-sim

      # core <- scene <- {sim, render, audio, assets} <- host <- {editor, agent}
      - name: Dependency direction
        run: cargo run -p xtask -- check-deps

      # Scenes in the repository are canonical, so a diff only ever shows a
      # real change rather than someone's editor reformatting a file.
      - name: Scene canonical form
        run: cargo run -p xtask -- fmt-scenes --check

      # docs/API.md and docs/schemas/ are build artifacts that are committed.
      # If they drift, an agent reads a contract the engine no longer honours.
      - name: Generated documentation is current
        run: |
          cargo run -p xtask -- gen-docs
          git diff --exit-code -- docs/ \
            || (echo "::error::docs/ is stale; run 'cargo xtask gen-docs' and commit" && exit 1)

  # Determinism and the test suite, on every platform the engine targets. A
  # replay that only holds on Linux is not determinism.
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Build runners have no GPU. lavapipe is Mesa's software Vulkan driver,
      # and is what lets the renderer be tested at all on Linux; macOS has
      # Metal and Windows has WARP without any extra installation.
      - name: Install a software Vulkan driver
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - name: Build
        run: cargo build --workspace

      # DIMETRIC_REQUIRE_GPU turns "no adapter, skipping" into a failure. Without
      # it a runner that lost its driver would go green having rendered nothing,
      # which is the failure mode a rendering test most needs to avoid.
      - name: Test
        run: cargo test --workspace
        env:
          DIMETRIC_REQUIRE_GPU: 1

      # Called out separately from the suite above so a divergence is obvious
      # in the job list rather than buried in test output.
      - name: Replay fixtures
        run: cargo test -p dimetric-agent --test fixtures

      - name: Golden images
        run: cargo test -p dimetric-host --test golden
        env:
          DIMETRIC_REQUIRE_GPU: 1

      # Uploaded on failure so the difference can be looked at rather than
      # guessed at from a percentage.
      - name: Keep the references on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.os }}
          path: tests/golden/references/*.png

  # The audio device backend. Off by default because it needs system headers,
  # which means nothing else in CI compiles it — and an optional feature nobody
  # builds is an optional feature that stops compiling.
  audio-device:
    name: Audio device backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install the audio development headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev

      # Built and linted, not run: a CI runner has no sound card, and the rules
      # worth testing — stealing, caps, fades — are in the mixer and covered by
      # the default suite against the mock backend.
      - name: Build
        run: cargo build -p dimetric-audio --features kira

      - name: Clippy
        run: cargo clippy -p dimetric-audio --features kira --all-targets -- -D warnings

  # The editor window. Off by default so the engine's own build does not pull
  # egui and winit; built and *driven* here, headlessly, so "it compiles" is not
  # the only thing anybody knows about it.
  editor-gui:
    name: Editor window
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install the windowing development headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev mesa-vulkan-drivers

      - name: Build
        run: cargo build -p dimetric-editor --features gui

      - name: Clippy
        run: cargo clippy -p dimetric-editor --features gui --all-targets -- -D warnings

      # egui_kittest drives the real widgets with no display attached: clicks
      # the actual buttons, types into the actual fields, and asserts what
      # reached the project underneath.
      - name: Drive the window headlessly
        run: cargo test -p dimetric-editor --features gui

  # The game runtime. Same shape as the editor's job: off by default, built and
  # then actually run here — under Xvfb on a software adapter, for three hundred
  # ticks, recording its input log. A player that compiles and opens a black
  # window would pass a build check.
  player-gui:
    name: Player window
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install the windowing development headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev mesa-vulkan-drivers xvfb

      - name: Build
        run: cargo build -p dimetric-player --features gui

      - name: Clippy
        run: cargo clippy -p dimetric-player --features gui --all-targets -- -D warnings

      # The sound device, built and linted but not run: a runner has no sound
      # card, and every rule the mixer has is tested against the mock backend
      # by the default suite.
      - name: Build with the sound device
        run: cargo clippy -p dimetric-player --features gui,sound --all-targets -- -D warnings

      - name: Play the example for three hundred ticks
        run: |
          xvfb-run -a -s "-screen 0 1440x810x24" \
            cargo run -p dimetric-player --features gui -- \
              examples/sorcerer --scene arena01.dim --ticks 300 --seed 42 \
              --record played.input

      # The claim the player rests on: a session someone played is an input log
      # like any other.
      - name: Replay what it recorded
        run: cargo run -p dimetric-agent -- --project examples/sorcerer --scene arena01.dim replay --input played.input

  # M0 — the de-risking spike. Its own job because it is its own workspace and
  # pulls in wgpu and winit, which nothing in the engine should build.
  #
  # The bar the design document sets for M0 is exactly this: a textured quad
  # renders on Windows, macOS and Linux in CI. The spike asserts its own output
  # — coverage and bounding box — so a zero exit is the assertion, not just
  # evidence that the process did not crash.
  m0-spike:
    name: M0 spike on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: spikes/m0-quad
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/m0-quad

      # Build runners have no GPU. lavapipe is Mesa's software Vulkan driver and
      # is what makes a headless render possible at all on Linux; macOS has
      # Metal and Windows has WARP without any extra installation.
      - name: Install a software Vulkan driver
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
        working-directory: .

      - name: Build
        run: cargo build

      - name: Render a quad, top-down
        run: cargo run -- --headless --projection top-down --out frame-top-down.png

      - name: Render a quad, isometric
        run: cargo run -- --headless --projection isometric --out frame-isometric.png

      # Uploaded so the three platforms' output can be compared by eye. This is
      # what answers whether the golden-image job planned for M3 can compare
      # exactly or needs a tolerance — a question no amount of local testing on
      # one machine can settle.
      - name: Keep the frames
        uses: actions/upload-artifact@v4
        with:
          name: m0-frames-${{ matrix.os }}
          path: spikes/m0-quad/*.png
