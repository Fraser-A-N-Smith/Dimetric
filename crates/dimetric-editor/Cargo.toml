[package]
name = "dimetric-editor"
description = "The editor's view state. The egui client is not in this build."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# The window. Off by default so `cargo build --workspace` does not pull egui and
# winit into every build of the engine.
gui = ["dep:eframe", "dep:dimetric-render"]

[[bin]]
name = "dim-editor"
path = "src/bin/dim-editor.rs"
required-features = ["gui"]

[dependencies]
eframe = { version = "0.35", optional = true }
dimetric-render = { workspace = true, optional = true }
dimetric-core.workspace = true
dimetric-host.workspace = true
dimetric-sim.workspace = true
dimetric-assets.workspace = true
dimetric-scene.workspace = true
serde.workspace = true
toml_edit.workspace = true

[dev-dependencies]
egui_kittest = "0.35"
dimetric-assets.workspace = true
dimetric-core.workspace = true
