[package]
name = "dimetric-sim"
description = "The deterministic tick loop: physics, scripting, snapshots and state hashing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
dimetric-core.workspace = true
dimetric-scene.workspace = true
dimetric-assets.workspace = true
blake3.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
mlua = { version = "0.10", features = ["lua54", "vendored"] }

[dev-dependencies]
dimetric-assets = { path = "../dimetric-assets" }
proptest.workspace = true

# No harness: the differences here are large, and a table anyone can read beats
# a statistics framework nobody re-runs.
[[bench]]
name = "handles"
harness = false
